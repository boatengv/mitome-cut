# Local development services.
#
#   docker compose up -d            Postgres + MinIO (then run `npm run dev`)
#   docker compose --profile app up The whole app in containers, on http://localhost:3000
#
name: mitome

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mitome
      POSTGRES_PASSWORD: mitome
      POSTGRES_DB: mitome
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitome"]
      interval: 3s
      retries: 20

  # S3-compatible storage, standing in for Cloudflare R2. Optional: the app
  # defaults to STORAGE_DRIVER=local, which needs nothing extra.
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: mitome
      MINIO_ROOT_PASSWORD: mitome-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 mitome mitome-secret &&
             mc mb --ignore-existing local/mitome && echo 'bucket ready'"

  api:
    profiles: [app]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://mitome:mitome@postgres:5432/mitome
      COOKIE_SECURE: "false"
    ports: ["3000:3000"]
    volumes: [storage:/app/data/storage]
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    profiles: [app]
    build: .
    command: ["node", "--enable-source-maps", "apps/server/dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://mitome:mitome@postgres:5432/mitome
    volumes: [storage:/app/data/storage]
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  miniodata:
  storage:
