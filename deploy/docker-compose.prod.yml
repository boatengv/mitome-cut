# Production on one server: Caddy (HTTPS) → API (+ web app), worker, Postgres.
# Media lives in Cloudflare R2, so the server's disk holds only the database.
#
# Run from the repo root on the server:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d --build
name: mitome

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  api:
    build: ..
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      DATABASE_URL: postgres://mitome:${POSTGRES_PASSWORD}@postgres:5432/mitome
      NODE_ENV: production
    volumes: [storage:/app/data/storage]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: ..
    restart: unless-stopped
    command: ["node", "--enable-source-maps", "apps/server/dist/worker.js"]
    env_file: ../.env.production
    environment:
      DATABASE_URL: postgres://mitome:${POSTGRES_PASSWORD}@postgres:5432/mitome
      NODE_ENV: production
    volumes: [storage:/app/data/storage]
    depends_on:
      api: { condition: service_healthy }
    # Renders are CPU-heavy: keep them from starving the API and database.
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 2g }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mitome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mitome
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitome"]
      interval: 5s
      retries: 20
    deploy:
      resources:
        limits: { memory: 1g }

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
